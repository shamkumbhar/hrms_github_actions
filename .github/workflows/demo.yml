name: HRMS CI/CD Pipeline new
on:
  push:
    branches: [ "main" ]
env:
  BACKEND_IMAGE: shamkumbhar47/backend:hrmsgitaction
  FRONTEND_IMAGE: shamkumbhar47/frontend:hrmsgitaction
jobs:
  # ======================================
  # 1️⃣ Backend Build Job
  # ======================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend with Maven
        working-directory: Backend_hrms
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: Backend_hrms
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

  # ======================================
  # 2️⃣ Frontend Build Job
  # ======================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular App
        working-directory: frontend
        run: npm run build -- --configuration production --no-prerender

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

       # ===============================
      # Deploy with Docker Compose
      # ===============================
      - name: Deploy using Docker Compose
        run: |
          docker-compose down --volumes --remove-orphans || true
          docker system prune -af --volumes
          docker-compose up –d

